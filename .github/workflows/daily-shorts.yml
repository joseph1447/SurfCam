name: Daily Shorts

# Costa Rica is UTC-6 year round (no DST). Both slots fall inside the live window,
# which restream-toggle opens at 5am CR and closes at 7pm CR.
on:
  schedule:
    - cron: '0 13 * * *'   # 7:00 AM Costa Rica
    - cron: '46 23 * * *'  # 5:46 PM Costa Rica
  workflow_dispatch:
    inputs:
      dry_run:
        description: Capture and crop but do not upload
        type: boolean
        default: false
      seconds:
        description: Clip length in seconds
        default: '40'
      privacy:
        description: privacyStatus for the upload
        type: choice
        options: [public, unlisted, private]
        default: public
      extra_args:
        description: Extra flags passed straight to yt-dlp (debugging)
        default: ''

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installed in isolation on purpose: the repo's package-lock.json is out of sync
      # with package.json so npm ci fails, and a full npm install would drag in the
      # whole Next/Remotion tree for a script that needs two packages. The symlink is
      # what lets ESM resolve the bare imports from scripts/.
      - name: Install script deps
        run: |
          mkdir -p "$RUNNER_TEMP/deps"
          cd "$RUNNER_TEMP/deps"
          npm init -y > /dev/null
          npm install --no-audit --no-fund googleapis mongoose
          ln -s "$RUNNER_TEMP/deps/node_modules" "$GITHUB_WORKSPACE/node_modules"

      # Pulled fresh every run on purpose: YouTube breaks pinned yt-dlp versions regularly.
      - name: Install yt-dlp
        run: |
          sudo curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version

      # yt-dlp needs a JS runtime to solve YouTube's player challenge. Without it the
      # runner gets "Sign in to confirm you're not a bot" on every extraction.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Ensure ffmpeg
        run: ffmpeg -version > /dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      # Only needed if YouTube starts rejecting the runner IP with "Sign in to confirm
      # you're not a bot". Export cookies.txt from a logged-in browser into the secret.
      - name: Write cookies if provided
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
            echo "Using cookies from secret"
          else
            echo "No YT_COOKIES secret - anonymous access"
          fi

      - name: Capture and upload Short
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_YT_CHANNEL_ID: ${{ vars.NEXT_PUBLIC_YT_CHANNEL_ID }}
          CLIP_SECONDS: ${{ inputs.seconds || '40' }}
          SHORT_PRIVACY: ${{ inputs.privacy || 'public' }}
          DRY_RUN: ${{ inputs.dry_run }}
          YTDLP_EXTRA_ARGS: ${{ inputs.extra_args }}
        run: node scripts/capture-short.mjs
